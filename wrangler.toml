name = "joblite-ahs"
main = "src/worker/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true
preview_urls = true
routes = [{ pattern = "joblite.online", custom_domain = true, previews_enabled = true }]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "joblite-db"
database_id = "369b4d6d-115d-41a3-ab93-132a25063758"
migrations_dir = "migrations"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "joblite-media"

[[queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "joblite-outbox"

[[queues.consumers]]
queue = "joblite-outbox"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "joblite-ingest"

[[queues.consumers]]
queue = "joblite-ingest"
max_batch_size = 5
max_batch_timeout = 10

[triggers]
crons = ["*/5 * * * *", "*/30 * * * *"]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://joblite.online"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
