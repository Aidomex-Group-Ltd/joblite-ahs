name = "joblite-ahs"
main = "src/worker/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "joblite-db"
database_id = "local-dev-db"
preview_database_id = "local-preview-db"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "joblite-media"

[[queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "joblite-outbox"

[[queues.consumers]]
queue = "joblite-outbox"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "joblite-ingest"

[[queues.consumers]]
queue = "joblite-ingest"
max_batch_size = 5
max_batch_timeout = 10

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
